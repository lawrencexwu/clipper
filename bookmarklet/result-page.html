<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipper</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #111;
      background: #fff;
      max-width: 760px;
    }
    header h1 { margin: 0 0 12px; font-size: 18px; }
    .meta h2 { margin: 0 0 4px; font-size: 16px; }
    .meta .muted { margin: 0; color: #666; font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .actions button {
      font: inherit;
      background: #111;
      color: #fff;
      border: 0;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .actions button:nth-child(n+2) {
      background: #fff;
      color: #111;
      border: 1px solid #ccc;
    }
    .actions button:hover { opacity: 0.85; }
    pre {
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 12px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error { color: #b91c1c; }
    .muted { color: #666; }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: #111;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }
  </style>
</head>
<body>
  <header><h1>Clipper</h1></header>
  <main id="root"><p class="muted">Waiting for the source tab to send the clip…</p></main>
  <div id="toast" hidden></div>
  <script src="result.js"></script>
</body>
</html>
